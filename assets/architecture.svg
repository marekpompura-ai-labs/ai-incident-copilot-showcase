<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"
     aria-labelledby="title desc">
  <title id="title">Db2 AI Incident Copilot, Release 1 components</title>
  <desc id="desc">The investigator uses the Copilot in a browser. The Copilot asks the Claude model and reads Db2
    only through a read-only MCP server. Init SQL scripts fill Db2 with synthetic data before the demo. The Copilot
    writes nothing to Db2 and keeps results in memory only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#54606e"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1d2733; }
    .title { font-size: 17px; font-weight: 600; }
    .sub { font-size: 13px; fill: #54606e; }
    .label { font-size: 12px; fill: #54606e; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .box { fill: #ffffff; stroke: #d9dee5; stroke-width: 1.5; }
    .core { fill: #e8eff6; stroke: #1f4e79; stroke-width: 2; }
    .line { stroke: #54606e; stroke-width: 1.5; fill: none; }
  </style>

  <rect width="960" height="480" fill="#f5f6f8"/>

  <!-- Investigator -->
  <rect class="box" x="30" y="150" width="190" height="80" rx="6"/>
  <text class="title" x="125" y="184" text-anchor="middle">Investigator</text>
  <text class="sub" x="125" y="206" text-anchor="middle">web browser</text>

  <!-- Copilot -->
  <rect class="core" x="290" y="110" width="300" height="160" rx="6"/>
  <text class="title" x="440" y="150" text-anchor="middle">Db2 AI Incident Copilot</text>
  <text class="sub" x="440" y="176" text-anchor="middle">Spring Boot, Spring AI, Thymeleaf</text>
  <text class="sub" x="440" y="206" text-anchor="middle">guards every query, keeps the evidence,</text>
  <text class="sub" x="440" y="226" text-anchor="middle">checks the report's citations</text>
  <text class="sub" x="440" y="252" text-anchor="middle">results held in memory only</text>

  <!-- Claude model -->
  <rect class="box" x="690" y="40" width="240" height="90" rx="6"/>
  <text class="title" x="810" y="74" text-anchor="middle">Claude model</text>
  <text class="sub" x="810" y="96" text-anchor="middle">Anthropic API</text>
  <text class="sub" x="810" y="116" text-anchor="middle">proposes queries and the report</text>

  <!-- MCP server -->
  <rect class="box" x="690" y="190" width="240" height="100" rx="6"/>
  <text class="title" x="810" y="224" text-anchor="middle">Read-only MCP server</text>
  <text class="sub mono" x="810" y="246" text-anchor="middle">db2-mcp-server 1.0.1</text>
  <text class="sub" x="810" y="268" text-anchor="middle">guarded SELECT, one schema</text>

  <!-- Db2 -->
  <rect class="box" x="690" y="350" width="240" height="80" rx="6"/>
  <text class="title" x="810" y="384" text-anchor="middle">IBM Db2</text>
  <text class="sub" x="810" y="406" text-anchor="middle"><tspan class="mono">COPILOT_DEMO</tspan>, synthetic data</text>

  <!-- Init scripts -->
  <rect class="box" x="370" y="350" width="220" height="80" rx="6"/>
  <text class="title" x="480" y="384" text-anchor="middle">Init SQL scripts</text>
  <text class="sub" x="480" y="406" text-anchor="middle">fill Db2 before the demo</text>

  <!-- Connections -->
  <line class="line" x1="222" y1="190" x2="288" y2="190" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="255" y="180" text-anchor="middle">HTTP</text>

  <line class="line" x1="592" y1="150" x2="688" y2="95" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="626" y="108" text-anchor="middle">HTTPS</text>

  <line class="line" x1="592" y1="235" x2="688" y2="240" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="640" y="228" text-anchor="middle">MCP, stdio</text>

  <line class="line" x1="810" y1="292" x2="810" y2="348" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="820" y="324">JDBC, read-only user</text>

  <line class="line" x1="592" y1="390" x2="688" y2="390" marker-end="url(#arrow)"/>

  <text class="sub" x="30" y="462">Release 1 is read-only: the Copilot writes nothing to Db2 and stores nothing. Its only path to Db2 is the MCP server.</text>
</svg>
